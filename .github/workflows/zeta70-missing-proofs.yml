name: Verify Zeta70 formal boundary

on:
  push:
    branches:
      - "audit/zeta70-formal-boundary-20260907"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib and cache
        working-directory: zeta70_missing_proofs
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Reject untrusted proof escapes
        working-directory: zeta70_missing_proofs
        shell: bash
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)|native_decide' \
            Zeta70MissingProofs.lean \
            Zeta70FormalBoundary.lean \
            Zeta70WeightedDispersion.lean \
            Zeta70Statement.lean; then
            echo "Untrusted proof escape found."
            exit 1
          fi
      - name: Compile
        working-directory: zeta70_missing_proofs
        env:
          LEAN_NUM_THREADS: "1"
        run: lake build --wfail
      - name: Independent kernel replay
        working-directory: zeta70_missing_proofs
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          lake env leanchecker Zeta70MissingProofs
          lake env leanchecker Zeta70FormalBoundary
          lake env leanchecker Zeta70WeightedDispersion
          lake env leanchecker Zeta70Statement
